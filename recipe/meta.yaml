{% set name = "model_bakery" %}
{% set version = "1.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 99571801a26b85b8dcba7f0ad39750aeb2f2477fe770d2291823e16788785000

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - django >=1.11.0
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - model_bakery

about:
  home: http://github.com/model-bakers/model_bakery
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Smart object creation facility for Django.
  doc_url: https://pypi.org/project/model-bakery/
  dev_url: https://github.com/model-bakers/model_bakery

extra:
  recipe-maintainers:
    - mxr-conda
    - bubblyorca
